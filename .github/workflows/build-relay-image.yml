name: Build lorca-relay image

on:
  schedule:
    # 每 6 小时检查一次上游是否发布了新的 CLI tag
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的上游 tag（如 cli-v0.1.11）；留空 = 最新的 cli-v*"
        required: false
        type: string
      force:
        description: "即使镜像已存在也强制重新构建"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build-relay-image

env:
  UPSTREAM: egoist/lorca
  IMAGE: ghcr.io/${{ github.repository_owner }}/lorca-relay

jobs:
  resolve:
    name: 解析上游版本
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: 解析最新的 cli-v* tag
        id: version
        env:
          WANT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # git ls-remote 不需要 API 令牌，不受速率限制；过滤掉 annotated tag 的 ^{} 剥离行
          tags=$(git ls-remote --tags "https://github.com/${UPSTREAM}.git" 'refs/tags/cli-v*' \
            | awk '{print $2}' | sed 's|refs/tags/||' | grep -v '\^{}')
          [ -n "$tags" ] || { echo "::error::在 ${UPSTREAM} 没有找到任何 cli-v* tag"; exit 1; }
          if [ -n "$WANT_TAG" ]; then
            grep -qx "$WANT_TAG" <<< "$tags" || { echo "::error::${UPSTREAM} 不存在 tag $WANT_TAG"; exit 1; }
            tag="$WANT_TAG"
          else
            tag=$(sort -V <<< "$tags" | tail -n1)
          fi
          version="${tag#cli-v}"
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "上游 tag：$tag（relay 版本 $version）"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 检查该版本是否已发布
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "$FORCE" != "true" ] \
            && docker buildx imagetools inspect "$IMAGE:$VERSION" > /tmp/manifest.txt 2>/dev/null \
            && grep -q 'linux/amd64' /tmp/manifest.txt \
            && grep -q 'linux/arm64' /tmp/manifest.txt; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$VERSION 已包含 amd64 和 arm64，跳过构建"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build-amd64:
    name: 构建 linux/amd64
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: egoist/lorca
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/relay/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.resolve.outputs.version }}-amd64
          cache-from: type=gha,scope=relay-amd64
          cache-to: type=gha,mode=max,scope=relay-amd64

  build-arm64:
    name: 构建 linux/arm64
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          repository: egoist/lorca
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/relay/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.resolve.outputs.version }}-arm64
          cache-from: type=gha,scope=relay-arm64
          cache-to: type=gha,mode=max,scope=relay-arm64

  merge:
    name: 发布 multi-arch manifest
    needs: [resolve, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 合并两个单架构镜像
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:${{ needs.resolve.outputs.version }}" \
            -t "${{ env.IMAGE }}:latest" \
            "${{ env.IMAGE }}:${{ needs.resolve.outputs.version }}-amd64" \
            "${{ env.IMAGE }}:${{ needs.resolve.outputs.version }}-arm64"

      - name: 验证 manifest
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ needs.resolve.outputs.version }}"
